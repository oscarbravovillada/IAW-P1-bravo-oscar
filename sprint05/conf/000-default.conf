# Fragment rellevant de /etc/apache2/sites-available/000-default.conf
# (no és el fitxer complet: només les directives que importen en aquest Sprint)

<VirtualHost *:80>
    DocumentRoot /var/www/html

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>
