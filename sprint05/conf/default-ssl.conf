# Fragment rellevant de /etc/apache2/sites-available/default-ssl.conf
# (no és el fitxer complet: només les directives que importen en aquest Sprint)

<VirtualHost *:443>
    DocumentRoot /var/www/html
    DirectoryIndex index.php index.html

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/apache-selfsigned.crt
    SSLCertificateKeyFile /etc/ssl/private/apache-selfsigned.key
</VirtualHost>
